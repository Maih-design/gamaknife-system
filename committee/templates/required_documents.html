<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المستندات المطلوبة</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .box {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 12px;
        }

        ul {
            line-height: 2;
        }

        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="no-print">
    <button onclick="window.print()">🖨️ طباعة</button>
</div>

<h1>📄 المستندات المطلوبة للعرض على اللجنة</h1>

<div class="box">

    <ul>
        <li>صورة البطاقة الشخصية</li>
        <li>البطاقة الصحية / الكارنيه</li>
        <li>التقارير الطبية الحديثة</li>
        <li>نتائج التحاليل</li>
        <li>الأشعات المطلوبة</li>
        <li>خطابات التحويل السابقة (إن وجدت)</li>
    </ul>

    <p>يرجى إحضار جميع المستندات أصل + صورة</p>

</div>

</body>
</html>
